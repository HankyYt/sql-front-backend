name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Deploy Backend and Stack
        run: |
          echo "Updating deployment at /home/admin/sqlfront..."
          
          cd /home/admin/sqlfront/sql-backend
          git fetch origin
          git reset --hard origin/main
          
          if [ -d "/home/admin/sqlfront/sql-frontend" ]; then
            echo "Updating frontend..."
            cd /home/admin/sqlfront/sql-frontend
            git fetch origin
            git reset --hard origin/main
            cd /home/admin/sqlfront/sql-backend
          fi
          
          echo "Rebuilding and restarting containers..."
          docker compose down || docker-compose down
          docker compose up -d --build || docker-compose up -d --build
